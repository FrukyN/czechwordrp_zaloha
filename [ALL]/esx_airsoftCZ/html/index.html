<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <title>Airsoft UI</title>
</head>
<body>
    <div id="app">
        <div id="lobby-container" class="menu-box" style="display: none;">
            <div class="header">
                <h1 id="arena-label">ARENA NÁZEV</h1>
                <p id="arena-price">Cena vstupu: 0 CZK</p>
            </div>
            <div class="teams-selection">
                <div class="team-card blue" onclick="joinTeam('blue')">
                    <h2>MODŘÍ</h2>
                    <p>PČR JEDNOTKA</p>
                    <button>VSTOUPIT</button>
                </div>
                <div class="team-card red" onclick="joinTeam('red')">
                    <h2>ČERVENÍ</h2>
                    <p>ODPOR</p>
                    <button>VSTOUPIT</button>
                </div>
            </div>
            <button class="close-btn" onclick="closeMenu()">ZAVŘÍT</button>
        </div>

        <div id="game-hud" style="display: none;">
            <div class="scoreboard">
                <div class="score-team blue-score">
                    <span class="team-tag">MOD</span>
                    <span id="blue-pts">0</span>
                </div>
                <div class="timer">
                    <span id="timer-text">10:00</span>
                </div>
                <div class="score-team red-score">
                    <span id="red-pts">0</span>
                    <span class="team-tag">ČER</span>
                </div>
            </div>
	    <div id="announcement" style="display: none;">
    		<div class="announcement-content">
        	   <h1 id="announcement-title">VÍTĚZ</h1>
        	   <p id="announcement-subtitle">MODRÝ TÝM OVLÁDL ARÉNU</p>
    		</div>
	    </div>
            
            <div id="status-indicator">
                <span id="status-text">V BOJI</span>
            </div>
        </div>

        <div id="killfeed"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
